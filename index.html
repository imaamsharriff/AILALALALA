<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd9e8" />
    <meta
      name="description"
      content="A ridiculously cute birthday website for Aila. Scientifically proven: Aila is prettier."
    />
    <title>🎀 Happy Birthday, Aila! 🎀</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>"
    />

    <!-- Cute rounded/handwritten display fonts. The whole site has a system
         fallback stack, so it still looks fine if Google Fonts is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Gaegu:wght@700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Boot fallback. React clears this the moment it mounts, so it is only
           ever visible if the app never started — which otherwise looks like a
           blank white page with no explanation. The most common cause is
           opening this file directly (file://), where browsers block ES
           modules for security. -->
      <div id="boot-fallback" style="
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        max-width: 34rem; margin: 12vh auto; padding: 2rem 1.5rem;
        text-align: center; color: #55223c; background: #fff;
        border: 3px solid #ffd0e4; border-radius: 28px;
        box-shadow: 0 14px 40px rgba(201,24,95,.18); line-height: 1.55;">
        <p style="font-size: 2.5rem; margin: 0 0 .5rem">🎀</p>
        <h1 style="font-size: 1.4rem; margin: 0 0 .75rem; color: #c9185f">
          The birthday surprise didn’t start
        </h1>
        <p id="boot-reason" style="margin: 0 0 1rem">
          Something stopped the page from loading. Open the browser console to
          see the error.
        </p>
        <p style="margin: 0; font-size: .95rem; color: #8a5a74">
          Still stuck? Run <code style="background:#ffe6f1;padding:.15em .45em;border-radius:6px">npm run dev</code>
          and open <strong>http://localhost:5173</strong>
        </p>
      </div>
    </div>

    <!-- A classic (non-module) script, so it runs even when module scripts are
         blocked — which is exactly the case we need to explain. -->
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('boot-reason').innerHTML =
          'This page was opened straight from your computer (a <strong>file://</strong> address). ' +
          'Browsers block the app’s JavaScript on file:// for security, so nothing can load.' +
          '<br><br><strong>Fix:</strong> open <strong>http://localhost:5173</strong> instead, ' +
          'or use the single-file build <strong>dist/aila-birthday.html</strong>, which is ' +
          'made for opening directly.'
      }
    </script>

    <noscript>
      <div style="font-family: sans-serif; padding: 2rem; text-align: center">
        <h1>🎀 Happy Birthday, Aila! 🎀</h1>
        <p>This birthday surprise needs JavaScript enabled. Please turn it on 💕</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
